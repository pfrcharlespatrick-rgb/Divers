# Publie le dossier du dépôt sur GitHub Pages à chaque envoi sur main.
# La première exécution allume aussi GitHub Pages (enablement), ce qui évite
# d'aller chercher le réglage à la main.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Allumer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
